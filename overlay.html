<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreGrid - Overlay</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /*
            .marcador-wrapper {
            position: relative;
            padding: 30px 50px 20px 50px;
            min-width: 550px;
            text-align: center;
            /* Degradado que se funde a transparente en los bordes 
            background:
                radial-gradient(ellipse at center, rgba(15, 15, 35, 0.95) 0%, rgba(15, 15, 35, 0.7) 50%, transparent 75%);
            /* Sin bordes, sin border-radius visible, solo la máscara de degradado 
        }
        */
        .marcador-wrapper {
            position: relative;
            padding: 30px 50px 20px 50px;
            min-width: 550px;
            text-align: center;
            z-index: 1;
        }

        .marcador-wrapper::before {
            content: "";
            position: absolute;
            inset: -120px; /* Hace el fondo más grande que el contenedor */
            z-index: -1;

            background: rgba(15, 15, 35, 0.9);
            border-radius: 50%; /* Forma elíptica */
            filter: blur(80px); /* Suaviza los bordes */
        }

        .torneo {
            font-size: 16px;
            font-weight: 700;
            color: #ffb800;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(255, 184, 0, 0.5);
            opacity: 0.9;
        }

        .jugadores {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 8px;
        }

        .jugador {
            font-size: 30px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            min-width: 140px;
            text-align: center;
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .puntuacion {
            font-size: 38px;
            font-weight: 900;
            color: #ffb800;
            text-shadow: 0 0 25px rgba(255, 184, 0, 0.7);
            min-width: 30px;
            text-align: center;
        }

        .vs {
            font-size: 18px;
            font-weight: 700;
            color: #8a8aad;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .separador {
            width: 70%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(180, 167, 214, 0.6), transparent);
            margin: 8px auto;
        }

        .fase {
            font-size: 17px;
            font-weight: 600;
            color: #b4a7d6;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(180, 167, 214, 0.4);
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="marcador-wrapper">
        <div class="torneo" id="torneo">Nombre del Torneo</div>
        <div class="jugadores">
            <span class="jugador" id="jugador1">Jugador 1</span>
            <span class="puntuacion" id="puntuacion1">0</span>
            <span class="vs">vs.</span>
            <span class="puntuacion" id="puntuacion2">0</span>
            <span class="jugador" id="jugador2">Jugador 2</span>
        </div>
        <div class="separador"></div>
        <div class="fase" id="fase">Cuartos de final</div>
    </div>

    <script>
        const socket = io();
        
        const torneo = document.getElementById('torneo');
        const jugador1 = document.getElementById('jugador1');
        const jugador2 = document.getElementById('jugador2');
        const puntuacion1 = document.getElementById('puntuacion1');
        const puntuacion2 = document.getElementById('puntuacion2');
        const fase = document.getElementById('fase');

        // Recibir estado inicial
        socket.on('estadoInicial', (datos) => {
            actualizarMarcador(datos);
        });

        // Recibir actualizaciones
        socket.on('estadoActualizado', (datos) => {
            actualizarMarcador(datos);
        });

        function actualizarMarcador(datos) {
            torneo.textContent = datos.torneo;
            jugador1.textContent = datos.jugador1;
            jugador2.textContent = datos.jugador2;
            puntuacion1.textContent = datos.puntuacion1;
            puntuacion2.textContent = datos.puntuacion2;
            fase.textContent = datos.fase;
        }
    </script>
</body>
</html>
